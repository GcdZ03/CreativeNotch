name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The bundle version and the tag must agree, or users end up with an app
      # that reports a different version than the release it came from — and
      # the installer's "already up to date" check silently stops working.
      # CoreInfo is the single source; Info.plist takes its value at bundle
      # time. Only the tag can disagree, so only the tag is checked.
      - name: Verify the tag matches CoreInfo.version
        run: |
          CORE=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/CreativeNotchCore/Version.swift)
          echo "tag=${{ steps.tag.outputs.version }}  CoreInfo=$CORE"
          if [ "$CORE" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::CoreInfo.version ($CORE) != tag (${{ steps.tag.outputs.version }}). Bump Sources/CreativeNotchCore/Version.swift."
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build and sign
        run: ./Scripts/bundle.sh release

      - name: Verify the signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/CreativeNotch.app
          codesign -dv dist/CreativeNotch.app 2>&1 | grep -q "Signature=adhoc" \
            || { echo "::error::expected an ad-hoc signature"; exit 1; }
          codesign -dv dist/CreativeNotch.app 2>&1 | grep -q "TeamIdentifier=not set" \
            || { echo "::error::a team identifier leaked into the build"; exit 1; }

      - name: Package
        id: package
        run: |
          NAME="CreativeNotch-${{ steps.tag.outputs.tag }}.tar.gz"
          tar -czf "$NAME" -C dist CreativeNotch.app
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CreativeNotch ${{ steps.tag.outputs.tag }}
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          body: |
            > **Early release, and a personal tool.** It is ad-hoc signed, not
            > notarised, and installed by a shell script. Install it to watch the
            > project develop, not to replace a notch app you already rely on.

            ## What is in it

            The foundation and **ten modules**, every one of which can be switched
            off in Settings — and switching one off stops what it runs, rather than
            hiding it:

            | | |
            |---|---|
            | **File shelf** | Drag a file onto the notch to stash it, drag it out later; remove one, or clear all, from the panel |
            | **System HUD** | Volume and brightness, in the notch, alongside Apple's |
            | **Media controls** | Play, pause, and skip from the panel |
            | **Clipboard history** | The last things you copied, with the time each was copied, gated on activity |
            | **Media metadata** | Now-playing title, artist, artwork, and an ambient badge |
            | **Battery and power state** | Level, charging state, Low Power Mode, and a gauge |
            | **Timer** | A countdown, counting down beside the notch |
            | **Preferences** | A settings window that stops a subsystem, not one that hides a feature |
            | **Global shortcut** | Open the notch from anywhere, registered with the window server rather than a global monitor |
            | **Camera** | A mirror under the lens, a shutter, and a record button |
            | **Capture indicator** | A tell in the notch when another app is using your camera or microphone |

            ## The panel, redrawn

            The open panel now opens *into* the notch rather than under it. The tabs
            are icons in the left ear of the camera housing, the battery level and a
            settings gear sit in the right ear, and nothing is drawn behind the
            housing — the same rule every peek already followed. Music is a column
            on the left with the cover, the track and the transport buttons; it
            stays put when nothing is playing, so the tabs never move. Each pane has
            a title row with a count and an action. One control vocabulary replaces
            the system-blue buttons the timer used to wear, the battery tab draws a
            real gauge, and a drag shows a dashed drop target instead of a bare label.

            Nothing about it adds a timer or a redraw: the clipboard shows the clock
            time an entry was copied rather than "2m ago", and the timer's progress
            track moves only when its digits do. The closed notch, the peeks and the
            badges are unchanged. Settings is a grouped form in five sections.

            ## Launch at login

            The last thing the roadmap was waiting on: a switch in Settings that
            **reads macOS rather than remembering an answer**.
            Turn the login item off in System Settings and the row shows it off,
            because there is no stored flag left to disagree with the system.

            It is not an eleventh entry in the table above and has no module
            toggle, because it runs nothing — there would be nothing for the
            toggle to stop. The switch also refuses to so much as ask unless the
            app is running from `/Applications`: reading the login-item status
            repoints the system's record at whichever copy did the reading, so a
            build run from anywhere else would quietly steal the record from your
            installed copy.

            A registration is a database row, not a launch, and the two can
            disagree. So it was not believed until a human logged out twice and
            found the app already running.

            ## The point of it

            > No subsystem runs when it isn't needed, and that rule is enforced
            > centrally rather than trusted to each module.

            Hover uses a tracking area rather than a global mouse monitor. Screen
            following listens for notifications rather than polling the cursor. The
            clipboard poller and the media helper are suspended outright when nothing
            is looking. That is what the project is for, and every module joins the
            same gate.

            The timer is the one documented exemption, and it is a split rather than
            a hole: its **redraws** are gated, its **deadline** never is. A countdown
            whose whole purpose is to fire while nobody is watching cannot be
            suspended for not being watched.

            ## What the HUD does — and deliberately does not do

            It shows volume and brightness **where macOS shows you nothing**: changes
            from Control Center, from Siri, or from another app.

            When you press the physical volume or brightness keys, the notch stays
            **silent** and Apple's own HUD appears as it always has. That is the
            intended behaviour, not a missing feature — the two coexist rather than
            one replacing the other, so nothing is hidden and nothing is shown twice.

            Staying silent for the keys needs **Accessibility** (System Settings →
            Privacy & Security → Accessibility) so the app can tell a keypress from
            any other cause. Without it the HUD still works, but you will see both
            overlays at once when you use the keys.

            It also ignores your **ambient light sensor**. Auto-brightness changes
            the backlight constantly, and those are real changes — 2301 of them
            measured in one session with nothing touched. The notch stays quiet for
            them. The trade-off: a Control Center brightness drag slower than about
            three seconds moves in steps too small to register, and will not show.

            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/GcdZ03/CreativeNotch/main/Scripts/install.sh | bash
            ```

            Re-run the same command to update.

            ### Installing by hand

            Download the `.tar.gz` below, then:

            ```bash
            tar -xzf CreativeNotch-${{ steps.tag.outputs.tag }}.tar.gz
            mv CreativeNotch.app /Applications/
            xattr -dr com.apple.quarantine /Applications/CreativeNotch.app
            ```

            That last line matters. The app is **ad-hoc signed, not
            notarised**, so a copy downloaded through a browser carries the
            quarantine flag and macOS will refuse to open it. The installer
            script avoids this entirely because `curl` never sets the flag.

            **Requires macOS 26 or later.** A physical notch is optional —
            notchless Macs get a pill under the menu bar.
