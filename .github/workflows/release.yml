name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The bundle version and the tag must agree, or users end up with an app
      # that reports a different version than the release it came from — and
      # the installer's "already up to date" check silently stops working.
      # CoreInfo is the single source; Info.plist takes its value at bundle
      # time. Only the tag can disagree, so only the tag is checked.
      - name: Verify the tag matches CoreInfo.version
        run: |
          CORE=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/CreativeNotchCore/Version.swift)
          echo "tag=${{ steps.tag.outputs.version }}  CoreInfo=$CORE"
          if [ "$CORE" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::CoreInfo.version ($CORE) != tag (${{ steps.tag.outputs.version }}). Bump Sources/CreativeNotchCore/Version.swift."
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build and sign
        run: ./Scripts/bundle.sh release

      - name: Verify the signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/CreativeNotch.app
          codesign -dv dist/CreativeNotch.app 2>&1 | grep -q "Signature=adhoc" \
            || { echo "::error::expected an ad-hoc signature"; exit 1; }
          codesign -dv dist/CreativeNotch.app 2>&1 | grep -q "TeamIdentifier=not set" \
            || { echo "::error::a team identifier leaked into the build"; exit 1; }

      - name: Package
        id: package
        run: |
          NAME="CreativeNotch-${{ steps.tag.outputs.tag }}.tar.gz"
          tar -czf "$NAME" -C dist CreativeNotch.app
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CreativeNotch ${{ steps.tag.outputs.tag }}
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          body: |
            > **Early release.** Two modules work: the **file shelf** (drag
            > a file onto the notch to stash it, drag it out later) and the
            > **system HUD** (volume and brightness shown in the notch).
            > **Media controls and clipboard history are not built yet.**
            > Install it to watch the project develop, not to replace a notch
            > app you already use.

            ## What the HUD does — and deliberately does not do

            It shows volume and brightness **where macOS shows you nothing**:
            changes from Control Center, from Siri, or from another app.

            When you press the physical volume or brightness keys, the notch
            stays **silent** and Apple's own HUD appears as it always has.
            That is the intended behaviour, not a missing feature — the two
            coexist rather than one replacing the other, so nothing is
            hidden from you and nothing is shown twice.

            Staying silent for the keys needs **Accessibility** (System
            Settings → Privacy & Security → Accessibility) so the app can
            tell a keypress from any other cause. Without it the HUD still
            works, but you will see both overlays at once when you use the
            keys.

            It also ignores your **ambient light sensor**. Auto-brightness
            changes the backlight constantly, and those are real changes —
            2301 of them measured in one session with nothing touched. The
            notch stays quiet for them. The trade-off: a Control Center
            brightness drag slower than about three seconds moves in steps
            too small to register, and will not show.

            The HUD draws into the **ears either side of the notch** —
            icon left, level bar right — so nothing sits behind the camera
            housing. Notchless Macs get a single centred pill.

            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/GcdZ03/CreativeNotch/main/Scripts/install.sh | bash
            ```

            Re-run the same command to update.

            ### Installing by hand

            Download the `.tar.gz` below, then:

            ```bash
            tar -xzf CreativeNotch-${{ steps.tag.outputs.tag }}.tar.gz
            mv CreativeNotch.app /Applications/
            xattr -dr com.apple.quarantine /Applications/CreativeNotch.app
            ```

            That last line matters. The app is **ad-hoc signed, not
            notarised**, so a copy downloaded through a browser carries the
            quarantine flag and macOS will refuse to open it. The installer
            script avoids this entirely because `curl` never sets the flag.

            **Requires macOS 26 or later.** A physical notch is optional —
            notchless Macs get a pill under the menu bar.
